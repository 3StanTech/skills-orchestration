name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: warfleet suite
        run: python3 -m unittest discover -s skills/warfleet/tests
      - name: stance suite
        run: python3 -m unittest discover -s skills/stance/tests
      - name: headless suite
        run: python3 -m unittest discover -s skills/headless/tests
      - name: hook suites
        run: python3 -m unittest discover -s hooks -p 'test_*.py'
